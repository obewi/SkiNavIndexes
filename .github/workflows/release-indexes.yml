name: Release SkiNav Indexes

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      dataset_version:
        description: "Dataset version. Defaults to current UTC date."
        required: false
        type: string
      publish_release:
        description: "Publish the generated assets as a GitHub Release."
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/release-indexes.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "README.md"

permissions:
  contents: read

jobs:
  smoke:
    name: Rust smoke checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build CLI
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

      - name: Check CLI help
        run: |
          cargo run --locked -- --help
          cargo run --locked -- fetch --help
          cargo run --locked -- build --help
          cargo run --locked -- validate --help
          cargo run --locked -- all --help

      - name: Delete generated runner data
        if: always()
        shell: bash
        run: |
          rm -rf target output data/raw/openskimap

  update:
    name: Update SkiNav indexes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          dataset_version="${{ inputs.dataset_version }}"
          if [ -z "$dataset_version" ]; then
            dataset_version="$(date -u +%F)"
          fi
          publish_release="${{ github.event_name == 'schedule' || inputs.publish_release }}"
          echo "dataset_version=${dataset_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=indexes-${dataset_version}" >> "$GITHUB_OUTPUT"
          echo "publish_release=${publish_release}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Restore persistent Overpass enrichment cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="data/raw/openskimap/.overpass"
          archive="$RUNNER_TEMP/overpass-cache.tar.gz"
          mkdir -p "$cache_dir"
          if gh release download overpass-cache \
              --repo "$GITHUB_REPOSITORY" \
              --pattern overpass-cache.tar.gz \
              --dir "$RUNNER_TEMP" \
              --clobber; then
            tar -xzf "$archive" -C "$cache_dir"
            echo "Restored persistent Overpass cache"
          else
            echo "No persistent Overpass cache release exists yet"
          fi

      - name: Build, validate, and package from OpenSkiMap GeoJSON
        run: |
          cargo run --release --locked -- all --dataset-version "${{ steps.settings.outputs.dataset_version }}"

      - name: Collect release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          hash="$(sha256sum output/catalog.sqlite.gz | cut -d' ' -f1)"
          size="$(wc -c < output/catalog.sqlite.gz | tr -d ' ')"
          pack_count="$(find output -maxdepth 1 -type f -name 'pack-*.sqlite.gz' | wc -l | tr -d ' ')"
          expected_release_tag="${{ steps.settings.outputs.release_tag }}"
          generated_release_tag="$(jq -r '.releaseTag // empty' output/latest.json)"
          if [ "$generated_release_tag" != "$expected_release_tag" ]; then
            echo "Generated releaseTag '$generated_release_tag' does not match '$expected_release_tag'" >&2
            exit 1
          fi
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "size=${size}" >> "$GITHUB_OUTPUT"
          echo "pack_count=${pack_count}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        if: steps.settings.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.settings.outputs.dataset_version }}"
          mkdir -p release/index
          cp output/latest.json release/index/latest.json
          cp output/catalog.sqlite.gz release/index/catalog.sqlite.gz
          cp output/pack-*.sqlite.gz release/index/
          tar -czf release/index/overpass-cache.tar.gz \
            -C data/raw/openskimap/.overpass .
          {
            echo "# SkiNavIndexes ${version}"
            echo
            echo "Generated from OpenSkiMap GeoJSON on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "- Catalog: catalog.sqlite.gz"
            echo "- Catalog compressed bytes: ${{ steps.metadata.outputs.size }}"
            echo "- Catalog SHA256: ${{ steps.metadata.outputs.hash }}"
            echo "- Source packs: ${{ steps.metadata.outputs.pack_count }} pack-*.sqlite.gz assets"
          } > release/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: steps.settings.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.settings.outputs.release_tag }}"
          title="SkiNavIndexes ${{ steps.settings.outputs.dataset_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists; refusing to mutate an immutable release." >&2
            exit 1
          fi
          gh release create "$tag" \
            release/index/latest.json \
            release/index/catalog.sqlite.gz \
            release/index/pack-*.sqlite.gz \
            --title "$title" \
            --notes-file release/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"

      - name: Update persistent Overpass cache release
        if: steps.settings.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cache_tag="overpass-cache"
          if gh release view "$cache_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$cache_tag" \
              release/index/overpass-cache.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$cache_tag" \
              release/index/overpass-cache.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "SkiNav Overpass enrichment cache" \
              --notes "Rolling persistent cache for successful SkiNavIndexes Overpass enrichment runs."
          fi

      - name: Update root latest.json entrypoint
        if: github.ref_name == github.event.repository.default_branch && steps.settings.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp output/latest.json latest.json
          if git diff --quiet -- latest.json; then
            echo "latest.json already matches generated release metadata"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for ${{ steps.settings.outputs.dataset_version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Delete generated runner data
        if: always()
        shell: bash
        run: |
          rm -rf release output data/raw/openskimap target
